name: macOS Build

# Fork-specific workflow. It lives only on the macOS branch and never touches
# the upstream Windows/Linux workflows, so it stays merge-safe with upstream.
#
# - Only tags (`v*-macos`, `v*-macos-experimental*`) trigger builds + releases.
# - There is NO `branches:` filter in this file, so pushing to `main` (e.g.
#   after merging upstream/main) does NOT trigger this workflow — no quota
#   is burned by upstream-sync pushes.
# - Manual `workflow_dispatch` is always available.
# - Tags ending in -macos build and then publish a GitHub release with the
#   DMGs/zip attached.
# - Tags containing -experimental (e.g. v4.1.6-macos-experimental, optionally
#   with a counter like -experimental-2) are published as pre-releases:
#   downloadable, but never the electron-updater "latest".
on:
  push:
    tags:
      - "v*-macos"
      - "v*-macos-experimental*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          # macos-13 (Intel) was retired by GitHub on 2025-12-08; macos-15-intel
          # is the supported x86_64 label (available through August 2027).
          - os: macos-15-intel
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/hydra-native -> target
          shared-key: native-${{ runner.os }}-${{ runner.arch }}
          cache-bin: false

      # build-torrent-bridge.cjs keeps its vcpkg checkout and installed packages
      # under ~/.cache/hydra. Caching that directory makes repeat builds fast.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/hydra
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/torrent-bridge/**/vcpkg*.json', 'native/torrent-bridge/**/triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build macOS app
        run: yarn build:mac --publish never
        env:
          # The renderer bundle peaks around 3 GB while bundling. GitHub's
          # standard macOS runners have 7 GB RAM, so Node derives a default
          # heap ceiling that is too low and the build aborts with exit 134
          # (JavaScript heap out of memory). Raise it explicitly.
          NODE_OPTIONS: "--max-old-space-size=4096"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL || 'https://hydra-api-us-east-1.losbroxas.org' }}
          MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_AUTH_URL || 'https://auth.hydra.losbroxas.org' }}
          MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_CHECKOUT_URL || 'https://checkout.hydralauncher.gg' }}
          MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL }}
          MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.MAIN_VITE_EXTERNAL_RESOURCES_URL }}
          RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.RENDERER_VITE_EXTERNAL_RESOURCES_URL }}
          MAIN_VITE_LAUNCHER_SUBDOMAIN: ${{ vars.MAIN_VITE_LAUNCHER_SUBDOMAIN }}
          RENDERER_VITE_REAL_DEBRID_REFERRAL_ID: ${{ vars.RENDERER_VITE_REAL_DEBRID_REFERRAL_ID }}
          RENDERER_VITE_TORBOX_REFERRAL_CODE: ${{ vars.RENDERER_VITE_TORBOX_REFERRAL_CODE }}
          RENDERER_VITE_SENTRY_DSN: ${{ vars.RENDERER_VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Point the in-app electron-updater at this fork's releases so users
          # see "update available" when a newer version tag is published here.
          MAIN_VITE_UPDATE_FEED_OWNER: cometmcisaac
          MAIN_VITE_UPDATE_FEED_REPO: hydra-macos
          RENDERER_VITE_UPDATE_FEED_OWNER: cometmcisaac
          RENDERER_VITE_UPDATE_FEED_REPO: hydra-macos

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-macos-${{ matrix.arch }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml

  # Runs only for tag pushes (e.g. v4.1.6-macos). Reuses the artifacts built by
  # the matrix above so the release ships the exact bits that were built.
  release:
    name: Publish macOS release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: Hydra-macos-arm64
          path: artifacts/arm64

      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: Hydra-macos-x64
          path: artifacts/x64

      - name: Stage release assets
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release
          # electron-builder gives both architectures the same DMG filename, so
          # disambiguate before attaching them to a single release.
          cp artifacts/arm64/*.dmg "release/Hydra-${VERSION}-arm64.dmg"
          cp artifacts/x64/*.dmg "release/Hydra-${VERSION}-x64.dmg"
          cp artifacts/arm64/*.zip "release/Hydra-${VERSION}-arm64-mac.zip"
          cp artifacts/x64/*.zip "release/Hydra-${VERSION}-mac.zip"
          ls -lh release

          # electron-updater fetches latest-mac.yml from the tag's download path
          # to detect a new version. autoDownload is off on macOS (the app only
          # shows a download notice), so the channel file is read but never used
          # to fetch anything — no signature is involved. Publish it from the
          # arm64 build; its zip entry already matches the staged name, and the
          # only rewrite needed is the generic DMG filename.
          node - <<'NODE'
          const fs = require("fs");
          const version = require("./package.json").version;
          const dmg = `Hydra-${version}-arm64.dmg`;
          const yml = fs
            .readFileSync("artifacts/arm64/latest-mac.yml", "utf8")
            .replace(/^(\s*- url:).*\.dmg\s*$/gm, `$1 ${dmg}`);
          fs.writeFileSync("release/latest-mac.yml", yml);
          console.log(yml);
          NODE

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Tags containing -experimental are published as GitHub pre-releases.
          # The suffix may carry a counter, e.g. v4.1.6-macos-experimental-2.
          # A pre-release is not returned by the /releases/latest API, so it
          # never becomes the electron-updater feed (users on the stable channel
          # won't be told to update) while still being downloadable.
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-experimental* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Auto-generate brief changelog from commits since upstream/main.
          CHANGELOG_FILE="release/changelog.md"
          {
            echo "Changes since upstream/main:"
            echo
            git log upstream/main..HEAD --oneline --format="- %s (%h)" 2>/dev/null \
              | head -n 30 || echo "- (upstream reference not fetched in CI)"
          } > "$CHANGELOG_FILE"

          NOTES_FILE="release/notes.md"
          {
            echo "Unsigned macOS build of the Hydra fork (arm64 + x64). After installing, clear the quarantine attribute:"
            echo
            echo "xattr -cr /Applications/Hydra.app"
            echo
            echo "---"
            echo
            cat "$CHANGELOG_FILE"
          } > "$NOTES_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              $PRERELEASE_FLAG \
              --title "Hydra ${TAG#v} (macOS)" \
              --notes-file "$NOTES_FILE"
          fi
